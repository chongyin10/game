version: '3.8'

services:
  # PostgreSQL 数据库
  postgres:
    image: postgres:15-alpine
    container_name: game-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres123}
      POSTGRES_DB: ${DB_NAME:-game_db}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    networks:
      - game-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Flask 后端 API
  backend:
    build:
      context: ./py
      dockerfile: Dockerfile
    container_name: game-backend
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-game_db}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres123}
    ports:
      - "${API_PORT:-5002}:5002"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - game-network

  # React 前端 (待开发后启用)
  # frontend:
  #   build:
  #     context: ./web
  #     dockerfile: Dockerfile
  #   container_name: game-frontend
  #   restart: unless-stopped
  #   ports:
  #     - "${WEB_PORT:-3000}:80"
  #   depends_on:
  #     - backend
  #   networks:
  #     - game-network

volumes:
  postgres_data:
    driver: local

networks:
  game-network:
    driver: bridge
